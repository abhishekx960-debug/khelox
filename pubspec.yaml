name: khelox
description: "Khelox - esports & rewards app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  hugeicons: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora/Sora-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800
